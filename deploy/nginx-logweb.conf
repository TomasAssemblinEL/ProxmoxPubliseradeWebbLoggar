# Nginx reverse proxy – produktionskonfiguration
# Hanterar tre domäner:
#   rudbergloggar.duckdns.org  -> loggserver (127.0.0.1:8080)
#   rud4berg.duckdns.org       -> Home Assistant (192.168.1.166:8123)
#   rud4bergimmich.duckdns.org -> Immich (192.168.1.24:2283)
#
# Kopiera till: /etc/nginx/sites-available/reverse-proxy
# Aktivera:    ln -sfn /etc/nginx/sites-available/reverse-proxy /etc/nginx/sites-enabled/reverse-proxy
# Certifikat:  certbot via dns-duckdns plugin (se README.md)

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Enkel rate limiting for publika ESP32-konfig-anrop.
limit_req_zone $binary_remote_addr zone=esp32_config_limit:10m rate=10r/m;

server {
    listen 80;
    # listen [::]:80;
    server_name rud4berg.duckdns.org rudbergloggar.duckdns.org rud4bergimmich.duckdns.org;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name rud4berg.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/rud4berg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rud4berg.duckdns.org/privkey.pem;

    location / {
        proxy_pass https://192.168.1.166:8123;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/websocket {
        proxy_pass https://192.168.1.166:8123/api/websocket;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name rudbergloggar.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/rudbergloggar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rudbergloggar.duckdns.org/privkey.pem;

    # Standardlage for loggdomanen: Basic Auth kravs for all trafik
    # om den inte uttryckligen undantas i en location nedan.
    auth_basic "Restricted log server";
    auth_basic_user_file /etc/nginx/.htpasswd-logweb;

    # ESP32-konfig-endpoints maste vara publikt anropbara for externa klienter.
    # Undanta endast de specifika pathar som behovs, begransa metoderna,
    # och stryp aggressiva upprepade anrop per klient-IP.
    location ~ ^/(setsolarconfig|setduration|settiming)/?$ {
        auth_basic off;
        limit_except GET POST { deny all; }
        limit_req zone=esp32_config_limit burst=3 nodelay;
        proxy_pass http://192.168.1.125;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /esp32 {
        return 301 /esp32/;
    }

    # Interaktiv ESP32-UI ligger under /esp32/ och ar fortsatt skyddad av Basic Auth.
    location /esp32/ {
        proxy_pass http://192.168.1.125/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # All ovrig trafik gar till Flask-applikationen pa den lokala loggservern.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name rud4bergimmich.duckdns.org;
    # Immich-domänen ligger i SAN-listan på certifikatet med cert-namn rud4berg.duckdns.org.
    ssl_certificate /etc/letsencrypt/live/rud4berg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rud4berg.duckdns.org/privkey.pem;

    # Immich kan ladda upp stora filer, sa hoj body-limit och timeout.
    client_max_body_size 50000M;
    proxy_request_buffering off;
    client_body_buffer_size 1024k;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://192.168.1.24:2283;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
