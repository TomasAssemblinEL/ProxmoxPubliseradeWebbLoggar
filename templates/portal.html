<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startportal</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --card: #fffdf8;
      --ink: #1e2430;
      --accent: #0f766e;
      --border: #d6cfc2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #fdf8ee 0%, var(--bg) 45%, #ece5d8 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(820px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(30, 36, 48, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 1rem + 2vw, 2.2rem);
      letter-spacing: 0.03em;
    }

    p {
      margin: 0 0 20px;
      color: #4a5567;
    }

    .actions {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    a.card {
      display: block;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f7f2e8 100%);
      padding: 16px;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .desc {
      color: #4b5563;
      font-size: 0.95rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Rudberg Loggportal</h1>
    <p>Välj vilken intern webbsida du vill öppna.</p>

    <section class="actions">
      <a class="card" href="{{ url_for('logs_index') }}">
        <div class="title">Proxmox loggserver</div>
        <div class="desc">Visa publicerade loggfiler från 192.168.1.65.</div>
      </a>

      <a class="card" href="/esp32/">
        <div class="title">ESP32 Greenhouse Control</div>
        <div class="desc">Öppna styrsidan på 192.168.1.125 via reverse proxy.</div>
      </a>

      <a class="card" href="{{ url_for('mixtank_index') }}">
        <div class="title">MixTank Mätningar</div>
        <div class="desc">Registrera och visa uppmätta värden från MixTanken.</div>
      </a>
    </section>
  </main>
</body>
</html>
